# ЭТОТ ФАЙЛ ГЕНЕРИРУЕТСЯ NginxConfigService (backend/src/system/nginx-config.service.ts)
# ИЗ nginx/nginx.conf.template + текущих настроек домена/HTTPS — НЕ РЕДАКТИРОВАТЬ ВРУЧНУЮ,
# правки вносить в nginx.conf.template. Закоммичен в git ОДИН РАЗ как безопасный дефолт для
# чистой установки (см. docker-compose.yml, volume у сервиса nginx) — дальнейшие коммиты
# НЕ ДОЛЖНЫ его трогать: backend перезаписывает этот файл на диске при каждом старте и
# изменении настроек, и если git тоже начнёт его менять, `git pull` при самообновлении
# будет конфликтовать с локально сгенерированной версией.
server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream backend:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
