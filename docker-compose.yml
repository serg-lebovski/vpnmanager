services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      PORT: 3000
      # Абсолютный путь репозитория на ХОСТЕ — тот же самый путь смонтирован ниже внутрь
      # контейнера, поэтому что "изнутри", что "снаружи" он указывает на одно и то же
      # место на диске хоста. Нужно для самообновления (system/update.service.ts):
      # `docker compose up -d --build`, запущенный ИЗ backend-контейнера через сокет
      # хоста, должен резолвить build-контексты/относительные volume-пути так же, как
      # если бы его запустили вручную с хоста. ВАЖНО: `docker compose up` должен
      # запускаться из корня репозитория (как и написано в README), иначе ${PWD} здесь
      # будет указывать не туда.
      REPO_PATH: ${PWD}
    volumes:
      # Даёт backend-контейнеру дёргать docker-демон ХОСТА (Docker-outside-of-Docker) —
      # это ПОЛНЫЙ root-эквивалент доступа к хосту, осознанный компромисс ради кнопки
      # "Обновить" в UI. Если это неприемлемо для вашей модели угроз — уберите обе строки
      # volumes и REPO_PATH выше; функции бэкапа БД и обычная работа панели не пострадают,
      # перестанет работать только самообновление по кнопке.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # nginx/generated/default.conf собирается NginxConfigService (backend/src/system/)
      # из nginx/nginx.conf.template + текущих настроек домена/HTTPS — не редактировать
      # руками, любые правки локаций вносить в nginx.conf.template.
      - ./nginx/generated:/etc/nginx/conf.d:ro
      # ACME HTTP-01 challenge — backend/certbot пишут сюда файлы вызова, nginx отдаёт их
      # на порту 80 по /.well-known/acme-challenge/.
      - ./certbot/webroot:/var/www/certbot:ro
      # Сертификаты Let's Encrypt — certbot (запущенный внутри backend-контейнера) пишет
      # сюда через --config-dir, nginx читает read-only. Путь совпадает с тем, что
      # certbot.service.ts передаёт в --config-dir, поэтому layout (live/<domain>/...)
      # у обоих контейнеров идентичен.
      - ./certbot/conf:/etc/letsencrypt:ro

volumes:
  postgres_data:
